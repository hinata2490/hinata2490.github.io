<h1>YouTube 投稿ツール</h1>
<p>運営者が自分の YouTube チャンネルへ動画を投稿し、再生数などの分析データを確認するための個人用ツールです。運営者本人のアカウントだけで使い、一般の利用者には提供していません。</p>
<p>使用する権限：動画のアップロードとサムネイルの設定、自分のチャンネルの情報と分析データの閲覧、自分の動画のタイトル・説明欄の更新。</p>
